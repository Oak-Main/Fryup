name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate content
        run: npm run validate:content
      # Gates the food-safety unit tests, including
      # tests/unit/bubble-reheating.test.ts (bubble-and-squeak reheating,
      # storage and repeat-reheating safety) from PR #5.
      - name: Unit and food-safety tests
        run: npm run test
      - name: Build
        run: npm run build
